version: 2
updates:
  # go.work at / puts this entry in dependabot's workspace mode, and no
  # setting turns that off (exclude-paths is not consulted for go.work's
  # use list). In that mode it updates any dependency of any workspace
  # module, running `go get` in every module and then `go work sync`,
  # which writes the workspace's selected versions into every go.mod and
  # raises a module's go line when one of them needs a newer Go (#207,
  # #210 and #291 moved the root to go 1.26 that way). allow keeps it to
  # the root module's own requirement, which `make deps` holds to
  # openresponses alone, so it no longer opens the nested modules'
  # updates; their own entries below do. A root update still runs across
  # the workspace and can still raise a floor; the root job in ci.yml
  # (Go 1.25) and the 1.26.x test job fail such a PR.
  - package-ecosystem: gomod
    directory: /
    allow:
      - dependency-name: github.com/ChristopherDavenport/openresponses
    schedule:
      interval: weekly
  # Each nested module has its own entry, so its updates do not depend on
  # the root entry's walk of go.work.
  - package-ecosystem: gomod
    directory: /sqlite
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: /otel
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
