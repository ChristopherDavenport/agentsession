name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 1.26 is the floor the sqlite and otel modules declare, and this
        # job builds all three modules; stable is the current release.
        # The root's own floor, 1.25, is the root job's.
        go: ["1.26.x", "stable"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: |
            go.sum
            sqlite/go.sum
            otel/go.sum
      - name: Build
        run: make build
      - name: Root module depends on openresponses and the standard library only
        run: make deps
      - name: Every first-party require is replaced with the tree
        run: make replaces
      - name: Vet (library and nested modules)
        run: make vet
      - name: Test (library and nested modules)
        run: make test

  # The root module declares go 1.25, below the nested modules' 1.26, so
  # it is tested alone on 1.25, outside the workspace, as a consumer
  # that takes only the root builds it. This is what notices a change,
  # such as a dependency update, that raises the root's floor.
  root:
    name: Test root module (Go 1.25.x)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.x"
          cache-dependency-path: go.sum
      - name: Vet
        run: GOWORK=off go vet ./...
      - name: Test
        run: GOWORK=off go test ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Not stable: staticcheck 2026.2.1 cannot read go1.27.2's export
          # data (dominikh/go-tools#1832). Back to stable once a release
          # with the fix is out.
          go-version: "1.26.x"
          # The runner's cached 1.26 can lag a security release, which
          # govulncheck then reports.
          check-latest: true
          cache-dependency-path: |
            go.sum
            sqlite/go.sum
            otel/go.sum
      - name: Check formatting
        run: make fmt
      - name: Check go.mod and go.sum are tidy in every module
        run: make tidy-check
      - name: staticcheck
        run: make lint
      - name: govulncheck
        run: make vuln

  # Single required status check for branch protection; it fails if any job
  # above failed, was cancelled or was skipped.
  checks:
    name: Checks
    if: always()
    needs: [test, root, lint]
    runs-on: ubuntu-latest
    steps:
      - name: Verify every job succeeded
        run: |
          echo '${{ toJSON(needs) }}'
          test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "false"
