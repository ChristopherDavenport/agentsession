name: Release

# Pushing an annotated tag vX.Y.Z, or <dir>/vX.Y.Z for a nested module,
# publishes a GitHub release whose notes are the tag message. A
# lightweight tag gets auto-generated notes instead.
#
# A release pushes every tag in one atomic push and GitHub fires one run
# per tag ref, so the runs are independent and may finish in any order.
# Each nested module is built here as a consumer gets it — outside the
# workspace, against the versions its published go.mod names, which are
# this same commit's tags.

on:
  push:
    tags: ["v*", "**/v*"]

permissions:
  contents: write

jobs:
  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        if: contains(github.ref_name, '/')
        with:
          go-version-file: go.mod
      - name: Build the tagged nested module outside the workspace
        if: contains(github.ref_name, '/')
        env:
          TAG: ${{ github.ref_name }}
        run: cd "${TAG%/v*}" && GOWORK=off go build ./... && GOWORK=off go test ./...
      - name: Create the release from the tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          notes="$(git tag -l --format='%(contents)' "$TAG")"
          if [ -n "$notes" ]; then
            gh release create "$TAG" --verify-tag --title "$TAG" --notes "$notes"
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
          fi
