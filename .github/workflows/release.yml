name: Release

# Pushing an annotated tag vX.Y.Z, or <dir>/vX.Y.Z for a nested module,
# publishes a GitHub release whose notes are the tag message. A
# lightweight tag gets auto-generated notes instead. A nested module is
# built the way a consumer builds it before its release is created, so a
# module whose go.mod requires a root version that does not carry what it
# uses never gets published.

on:
  push:
    tags: ["v*", "**/v*"]

permissions:
  contents: write

jobs:
  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        if: contains(github.ref_name, '/')
        with:
          go-version-file: go.mod
      # Only the module this tag names: at the intermediate commits of a
      # release the other nested modules still require the previous root,
      # and checking them here would fail the run for a module that is
      # perfectly good.
      - name: Build the tagged nested module outside the workspace
        if: contains(github.ref_name, '/')
        env:
          TAG: ${{ github.ref_name }}
        run: make release-check RELEASE_SUBMODULES="${TAG%/v*}"
      - name: Create the release from the tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          notes="$(git tag -l --format='%(contents)' "$TAG")"
          if [ -n "$notes" ]; then
            gh release create "$TAG" --verify-tag --title "$TAG" --notes "$notes"
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
          fi
